<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hồ sơ | LHU Student Portal</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="index.html">LHU Portal</a><nav aria-label="Điều hướng chính"><a href="index.html">Tổng quan</a><a href="courses.html">Học phần</a><a href="profile.html">Hồ sơ</a></nav><p class="sidebar-note">Cổng học tập cá nhân</p></aside><main class="main-content"><header class="page-heading"><p class="eyebrow">TÀI KHOẢN CÁ NHÂN</p><h1>Hồ sơ sinh viên</h1><p>Cập nhật thông tin liên hệ trong phiên xem hiện tại.</p></header><section class="panel profile-panel"><form id="profile-form" novalidate><label for="full-name">Họ và tên</label><input id="full-name" name="name" required><span id="profile-name-error" class="field-error"></span><label for="student-code">Mã sinh viên</label><input id="student-code" name="studentId" required><span id="profile-id-error" class="field-error"></span><label for="email">Email</label><input id="email" name="email" type="email" required><span id="profile-email-error" class="field-error"></span><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel"><span id="profile-phone-error" class="field-error"></span><button type="submit">Lưu thông tin</button><p id="profile-status" role="status" aria-live="polite"></p></form></section><section class="panel"><p class="eyebrow">THÔNG TIN ĐÃ LƯU</p><h2>Xem trước hồ sơ</h2><p>Họ tên: <strong id="profile-name-display"></strong></p><p>Mã sinh viên: <strong id="profile-id-display"></strong></p><p>Email: <strong id="profile-email-display"></strong></p><p>Điện thoại: <strong id="profile-phone-display"></strong></p></section></main></div><script src="script.js"></script></body></html>
